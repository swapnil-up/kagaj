name: Translate Verbatims (Backfill)

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Verbatims to process per run (0 = unlimited, stops when Gemini quota exhausted)
        default: '0'
        required: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  translate-verbatims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddlex
          key: paddlex-${{ runner.os }}
      - name: Restore partial verbatim segment cache
        uses: actions/cache/restore@v4
        with:
          path: output/verbatims
          key: verbatim-segment-cache-${{ github.run_id }}
          restore-keys: |
            verbatim-segment-cache-
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libgl1 libglib2.0-0
      - name: Install Python deps
        run: pip install -e ".[billtracker,ocr]"
      - name: Ensure schema exists (idempotent)
        if: env.DATABASE_URL != ''
        run: python parliament/scripts/init_db.py
      - name: Process verbatims until quota exhausted
        run: python parliament/scripts/process_verbatim.py --retry-failed --max-count ${{ github.event.inputs.count || '0' }}
      - name: Save partial verbatim segment cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: output/verbatims
          key: verbatim-segment-cache-${{ github.run_id }}
      - name: Upsert to pgvector (if DATABASE_URL configured)
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: python parliament/scripts/upsert_verbatim.py datasets/translations/Verbatim_*.json
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add parliament/manifests/verbatims.json datasets/translations/Verbatim_*.json
          git diff --cached --quiet || (git commit -m "translate verbatims" && git push)
