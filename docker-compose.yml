services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: kagaj-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kagaj
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
