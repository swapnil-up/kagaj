[project]
name = "kagaj"
version = "0.1.0"
description = "Turn Nepali government PDFs into open, structured data"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["kagaj_core*", "redbook_parser*", "migration_parser*", "water_parser*", "cidmap*", "dictionary*"]
exclude = ["archive*", "output*", "tmpvenv*", "parliament*", "drug_prices*", "tests*"]

[project.optional-dependencies]
# Budget PDF extraction (redbook_parser, cidmap)
redbook = [
    "pymupdf",
    "numpy",
]

# OCR pipeline (PaddleOCR-based extraction for legacy fonts)
ocr = [
    "paddleocr>=3.5.0",
    "paddlepaddle<3.3,>=3.1",
    "pdf2image>=1.17.0",
    "numpy",
]

# Bill-tracker scripts (scrape, process, upsert)
billtracker = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "psycopg[binary]>=3.2.0",
]

# KUKL water-schedule extraction (water_parser)
water = [
    "pymupdf",
    "openpyxl",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "numpy",
    "pdf2image>=1.17.0",
    "paddleocr>=3.5.0",
    "paddlepaddle<3.3,>=3.1",
]

# Testing
test = [
    "pytest",
    "pandas",
]

# Everything needed for CLI/CI work
dev = [
    "kagaj[redbook,billtracker,ocr,water,test]",
]

# Full install (all components)
all = [
    "kagaj[redbook,billtracker,ocr,water,test]",
]
